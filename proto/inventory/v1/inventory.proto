syntax = "proto3";

package inventory.v1;

// InventoryService owns stock levels. Other services never read its data
// directly; they call these RPCs.
service InventoryService {
  // CheckStock returns how many units of a SKU are available.
  // Errors: INVALID_ARGUMENT (empty sku), NOT_FOUND (unknown sku).
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);

  // ReserveStock atomically checks and decrements stock.
  // Errors: INVALID_ARGUMENT (empty sku or quantity <= 0), NOT_FOUND (unknown sku),
  // FAILED_PRECONDITION (not enough stock).
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
}

message CheckStockRequest {
  string sku = 1;
}

message CheckStockResponse {
  string sku = 1;
  int32 available = 2;
}

message ReserveStockRequest {
  string sku = 1;
  int32 quantity = 2;
}

message ReserveStockResponse {
  string sku = 1;
  // Units left after this reservation.
  int32 remaining = 2;
}
