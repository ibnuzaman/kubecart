syntax = "proto3";

package order.v1;

// OrderService creates orders. It reserves stock through InventoryService
// before it stores an order.
service OrderService {
  // CreateOrder reserves stock and stores a new order.
  // Errors: INVALID_ARGUMENT (empty sku or quantity <= 0), plus NOT_FOUND and
  // FAILED_PRECONDITION passed through from InventoryService.
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
}

message CreateOrderRequest {
  string sku = 1;
  int32 quantity = 2;
}

message CreateOrderResponse {
  Order order = 1;
}

message Order {
  string id = 1;
  string sku = 2;
  int32 quantity = 3;
}
