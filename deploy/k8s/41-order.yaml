# Same shape as 40-inventory.yaml; comments there explain each part.
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: kubecart
spec:
  selector:
    app.kubernetes.io/name: order
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: kubecart
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: order
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order
        app.kubernetes.io/part-of: kubecart
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order
          image: kubecart/order-service:dev
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: grpc
              containerPort: 50051
          env:
            - name: GRPC_ADDR
              value: ":50051"
            - name: INVENTORY_ADDR
              valueFrom:
                configMapKeyRef:
                  name: kubecart-config
                  key: INVENTORY_ADDR
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-db
                  key: DATABASE_URL
          startupProbe:
            grpc:
              port: 50051
            periodSeconds: 2
            failureThreshold: 20
          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            grpc:
              port: 50051
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
