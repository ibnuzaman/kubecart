# Schema migrations run once per deploy as Jobs, independent of how many
# server replicas there are. They use the server's own image, which embeds
# the migrations, so schema and code versions always match.
#
# A Job's pod template is immutable, so `make k8s-deploy` deletes the old
# Jobs before applying these again.
apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-migrate
  namespace: kubecart
spec:
  # Retries cover Postgres not being ready yet; each attempt is a new pod,
  # so every failed attempt's logs stay visible.
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-migrate
        app.kubernetes.io/part-of: kubecart
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: kubecart/inventory-service:dev
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-db
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: order-migrate
  namespace: kubecart
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-migrate
        app.kubernetes.io/part-of: kubecart
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: kubecart/order-service:dev
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-db
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
