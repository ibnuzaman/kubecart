# Reverse proxy in front of the gateway replicas. Mounted into
# /etc/nginx/conf.d/, so everything here sits inside the image's http {} block.

# One line per request. upstream_addr shows which gateway replica served it.
log_format proxy '$remote_addr "$request" $status bytes=$body_bytes_sent '
                 'upstream=$upstream_addr upstream_status=$upstream_status '
                 'rt=$request_time urt=$upstream_response_time gzip=$gzip_ratio';
# access_log is set per server below: the image's nginx.conf already has one
# at http level, and a second one at the same level would log every request
# twice. A server-level access_log replaces the inherited one.

# Docker's embedded DNS. valid=10s re-resolves names, so restarted gateway
# containers with new IPs are picked up without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream gateway {
    # least_conn sends each request to the replica with the fewest active
    # connections. Delete this line to get the default, round robin.
    least_conn;
    # Required by `resolve`: the group's state lives in shared memory.
    zone gateway 64k;
    server gateway:8080 resolve;
    # Reuse up to 16 idle TCP connections to the gateways instead of opening
    # a new one per request.
    keepalive 16;
}

# 10 requests/second per client IP, tracked in 10MB of shared memory
# (about 160k IPs).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

gzip on;
# Default is text/html only.
gzip_types application/json;
# Below ~1KB the gzip header costs more than it saves.
gzip_min_length 1000;
# Note: compressing responses over TLS that mix secrets with user input
# allows BREACH attacks. Our responses don't, but keep it in mind.

# Plain HTTP only redirects to HTTPS.
server {
    listen 80;
    access_log /var/log/nginx/access.log proxy;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;
    access_log /var/log/nginx/access.log proxy;

    # TLS ends here; traffic to the gateways is plain HTTP on the internal
    # network. Generate the files with `make certs`.
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        # burst=20: up to 20 requests above the rate are accepted at once
        # (nodelay = served immediately, not queued); beyond that, 429.
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://gateway;
        # HTTP/1.1 with an empty Connection header is what lets `keepalive`
        # above reuse connections.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Tell the gateway who the real client is; it only sees nginx's IP.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        # A bit above the gateway's own 3s deadline, so normally the gateway
        # answers 504 itself before nginx gives up.
        proxy_read_timeout    5s;
    }

    location = /healthz {
        # Not rate limited, so health checks never get 429.
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
